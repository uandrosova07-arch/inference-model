[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-retrieval-inference"
version = "0.1.0"
description = "Documents to SPLADE to SEISMIC experimental pipeline"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

